<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Project Worth</title>
  <style>
    :root {
      --navy: #0f3158;
      --gold: #c89b2f;
      --gold-dark: #a87d1f;
      --cream: #faf6ef;
      --white: #ffffff;
      --shadow: 0 18px 46px rgba(15, 49, 88, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 20%, rgba(200,155,47,0.18), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(200,155,47,0.14), transparent 34%),
        linear-gradient(180deg, #07172a 0%, #081b33 55%, #091829 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    .star {
      position: absolute;
      color: #ffd24a;
      opacity: 0.28;
      text-shadow: 0 0 12px rgba(255,210,74,0.42);
      animation: float 7s ease-in-out infinite;
      pointer-events: none;
    }

    .s1 { top: 8%; left: 9%; font-size: 1.1rem; }
    .s2 { top: 14%; right: 13%; font-size: 0.85rem; animation-delay: 1.2s; }
    .s3 { bottom: 13%; left: 17%; font-size: 0.95rem; animation-delay: 2.5s; }
    .s4 { bottom: 18%; right: 10%; font-size: 1.2rem; animation-delay: 3.4s; }
    .s5 { top: 44%; left: 6%; font-size: 0.75rem; animation-delay: 4.1s; }
    .s6 { top: 34%; right: 7%; font-size: 0.75rem; animation-delay: 5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.22; }
      50% { transform: translateY(-8px); opacity: 0.42; }
    }

    .thank-you-card {
      width: min(92vw, 720px);
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.13), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(250,246,239,0.96));
      color: #171717;
      border: 2px solid rgba(200,155,47,0.55);
      border-top: 7px solid var(--gold);
      border-radius: 32px;
      padding: clamp(2rem, 5vw, 3.4rem);
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    .thank-you-card::before,
    .thank-you-card::after {
      content: "★ ★ ★";
      position: absolute;
      color: var(--gold);
      opacity: 0.16;
      letter-spacing: 0.7rem;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .thank-you-card::before { top: 1.1rem; left: 1.2rem; }
    .thank-you-card::after { right: 1.2rem; bottom: 1.1rem; }

    .logo-wrap {
      width: 118px;
      height: 118px;
      margin: 0 auto 1.3rem;
      border-radius: 50%;
      border: 4px solid var(--gold);
      box-shadow: 0 14px 30px rgba(15,49,88,0.18);
      overflow: hidden;
      background: var(--white);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .eyebrow {
      color: var(--gold-dark);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 900;
      font-size: 0.82rem;
      margin-bottom: 0.7rem;
    }

    h1 {
      color: var(--navy);
      font-size: clamp(2.3rem, 6vw, 4rem);
      line-height: 1.05;
      margin-bottom: 1rem;
      font-weight: 900;
    }

    p {
      max-width: 560px;
      margin: 0 auto 1.1rem;
      color: #334052;
      line-height: 1.7;
      font-size: 1.05rem;
      font-weight: 650;
    }

    .gold-line {
      width: 110px;
      height: 4px;
      background: var(--gold);
      border-radius: 999px;
      margin: 1.4rem auto 1.5rem;
    }

    .btn {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.95rem 1.35rem;
      border-radius: 999px;
      background: var(--gold);
      color: var(--white);
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(200,155,47,0.26);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      background: var(--gold-dark);
      transform: translateY(-2px);
    }

    .small-note {
      margin-top: 1.35rem;
      font-size: 0.9rem;
      color: #5e6470;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      .star, .btn { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <span class="star s1">★</span>
  <span class="star s2">★</span>
  <span class="star s3">★</span>
  <span class="star s4">★</span>
  <span class="star s5">★</span>
  <span class="star s6">★</span>

  <main class="thank-you-card">
    <div class="logo-wrap">
      <img src="PROJECT-WORTH-LOGO.png" alt="Project Worth Logo" />
    </div>

    <div class="eyebrow">Message Received</div>
    <h1>Thank You</h1>
    <div class="gold-line"></div>

    <p>Thank you for your message. A Project Worth team member will reach out to you soon.</p>
    <p>We are grateful you took the time to connect with us.</p>

    <a class="btn" href="/">Return to Project Worth</a>
    <div class="small-note">Together, we light up the darkness.</div>
  </main>
</body>
</html>
