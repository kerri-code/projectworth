name: Project Worth dev checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            chat/package-lock.json
            infrastructure/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci --prefix chat
          npm ci --prefix infrastructure
          cd chat
          npx playwright install --with-deps chromium
      - name: Check types and unit tests
        run: |
          npm --prefix infrastructure run check
          npm --prefix infrastructure test
          npm --prefix chat test
      - name: Synthesize CDK with security checks
        working-directory: infrastructure
        run: npm run synth -- -c config=config.example.json
      - name: Synthetic browser tests
        working-directory: chat
        run: npm run test:e2e
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-validation-${{ github.sha }}
          path: |
            infrastructure/cdk.out/
            chat/test-results/
          retention-days: 30
# Deployment and cross-account credentials are deliberately separate from PR checks.
# No AWS credentials, user accounts or real messages are used by this workflow.
